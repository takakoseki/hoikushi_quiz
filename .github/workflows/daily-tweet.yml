name: 今日の1問 メール送信

on:
  # 2026-08-10：Xアカウントが恒久的に読み取り専用となり投稿できなくなったため、
  # 定期実行を停止している。異議申し立てが通ってアカウントが復活したら、
  # 下の cron のコメントを外すだけで元に戻る。
  # schedule:
  #   - cron: '0 0 * * *'  # 毎日 9:00 JST (= 0:00 UTC)
  workflow_dispatch:      # 手動実行は引き続き可能

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: 依存パッケージをインストール
        run: npm install
        working-directory: .github/scripts

      - name: 今日の1問をメール送信
        run: node .github/scripts/daily_tweet.js
        env:
          NOTIFY_GMAIL_USER: ${{ secrets.NOTIFY_GMAIL_USER }}
          NOTIFY_GMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
