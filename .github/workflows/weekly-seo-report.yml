name: 週次SEOレポート

on:
  schedule:
    # 毎週水曜 9:00 JST。
    # 集計対象は前々週の月曜〜日曜（3日前が終端）。
    # GA4は24〜48時間、GSCは2〜3日データ確定に要するため、
    # 月曜実行では前日（日曜）の数値が暫定値となり判断を誤る。
    - cron: '0 0 * * 3'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  seo-report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: 依存パッケージをインストール
        run: npm install
        working-directory: .github/scripts

      - name: 週次SEOレポートを生成・Issue作成
        run: node .github/scripts/seo_report.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_GMAIL_USER: ${{ secrets.NOTIFY_GMAIL_USER }}
          NOTIFY_GMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
