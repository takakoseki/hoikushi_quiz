              '- [ ] ID239・ID728：子どもの一次救命処置・AEDの使用（小児用パッド、胸骨圧迫のテンポ等）。JRC蘇生ガイドラインの改訂で推奨が変わっていないか確認',
              '- [ ] ID418：食事中の窒息・誤嚥の予防（消費者庁は硬い豆・ナッツ類を5歳以下の子どもに食べさせないよう呼びかけ、「教育・保育施設等における事故防止及び事故発生時の対応のためのガイドライン」（平成28年3月）は食事の介助で汁物などの水分を適切に与えるとしている）。呼びかけの対象年齢やガイドラインの改訂がないか確認',
              '- [ ] ID429：学校保健統計調査の肥満傾向児（肥満度20%以上）・痩身傾向児（肥満度-20%以下）の基準（平成18年度から）。算出方法の変更がないか確認',
              '- [ ] ID12：保育所等の職員による虐待の防止（令和7年改正児童福祉法で通報義務など。通報義務の対象施設に認可外保育施設を含む。国のガイドラインは「不適切な保育」の概念を用いず「虐待」を軸に整理）。対象施設の範囲の見直しやガイドラインの改訂がないか確認',
              '- [ ] ID14：困難な問題を抱える女性への支援に関する法律（女性相談支援センターは都道府県に設置義務、女性相談支援員は都道府県は必置・市町村は努力義務）。法改正がないか確認',
