name: 試験情報の棚卸し

on:
  schedule:
    # 毎年2月1日と8月1日の9:00 JST。
    # 保育士試験は前期・後期の年2回で、受験申請の前に実施要領が公表される。
    # 申請期の前に棚卸しすることで、古い情報のまま受験生に届くのを防ぐ。
    - cron: '0 0 1 2,8 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 棚卸しIssueを作成
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 実技試験の情報が最新かを確認してください',
              '',
              'サイトに掲載している実技試験の情報は、**年度や試験回によって変更されることがあります**。',
              '過去に「使用できる楽器」の範囲が変わり、サイトの記述が古いまま残っていた事例があります',
              '（アコーディオンが認められなくなったが、サイトには残っていた）。',
              '',
              '### 確認先',
              '',
              '- [全国保育士養成協議会 実技試験概要](https://www.hoyokyo.or.jp/exam/)',
              '',
              '### 照合するページ',
              '',
              '- `flashcard/jitsugi/index.html`（実技試験の選び方）',
              '- `flashcard/jisshu-riron/index.html`（保育実習理論の実技セクション）',
              '- `flashcard/index.html`（トップページの実技セクション）',
              '',
              '### チェックリスト',
              '',
              '- [ ] 3分野から2分野を選択する仕組みに変更はないか',
              '- [ ] 分野名（音楽／造形／言語に関する技術）に変更はないか',
              '- [ ] 配点（各50点満点）と合格ライン（6割以上）に変更はないか',
              '- [ ] **音楽：使用できる楽器**（ピアノまたはギター）に変更はないか',
              '- [ ] 造形：試験時間45分、枠の大きさ（縦横19cm）に変更はないか',
              '- [ ] 造形：使用できる画材の条件に変更はないか',
              '- [ ] 言語：3分間・3歳児クラス・子ども15人程度の想定に変更はないか',
              '- [ ] 言語：課題が入室後に指定される方式に変更はないか',
              '- [ ] 変更があった場合、該当ページを修正した',
              '- [ ] `flashcard/jitsugi/index.html` の「◯年◯月◯日時点」の日付を更新した',
              '',
              '## 過去問ページへのリンクの確認',
              '',
              '- [ ] `flashcard/index.html`「保育士試験の過去問（無料）」と `flashcard/hoiku-shinrigaku/index.html`「保育の心理学の過去問」のリンク先（全国保育士養成協議会「過去の試験問題」）が開けるか',
              '- [ ] 公式サイトで過去の筆記試験の問題・正答が引き続き公開されているか（公開をやめた場合は欄の記述を見直す）',
              '- [ ] 両ページの「◯年◯月◯日時点」の日付を更新した',
              '',
              '## 合格後の手続きページの確認',
              '',
              '- [ ] `flashcard/goukakugo/index.html` の登録事務処理センターへのリンク（https://www.nippo.or.jp/hoikushi/ ）が開けるか',
              '- [ ] 保育士登録の流れ（手引きの取り寄せ→書類をそろえ手数料を払い込んで郵送）、申請に期限がないこと、保育士証の交付までの目安（おおむね2か月程度）が、登録事務処理センターの案内と一致しているか',
              '- [ ] 保育士・保育所支援センターの説明（都道府県・指定都市・中核市が社会福祉協議会などを通じて設置）が、厚生労働省の案内と一致しているか',
              '- [ ] 広告を掲載している場合、ASPの広告掲載URL管理にこのページが提出されているか（ルール53）',
              '- [ ] ページ末尾の「◯年◯月◯日時点」の日付を更新した',
              '',
              '## 法令改正に連動する出題内容の確認',
              '',
              '制度が変わると**問題の正解そのものが変わる**論点です。',
              '過去に、令和8年4月にカシューナッツが特定原材料へ移行した際、',
              '「8品目」と記載した4問と科目ページのFAQが誤った状態のまま残っていました。',
              '',
              '### 確認先',
              '',
              '- [消費者庁 食物アレルギー表示に関する情報](https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/allergy/)',
              '',
              '### チェックリスト',
              '',
              '- [ ] 特定原材料（表示義務）の品目名と品目数に変更はないか',
              '- [ ] 特定原材料に準ずるもの（表示推奨）の品目に変更はないか',
              '- [ ] 変更があった場合、`flashcard/questions.js` の該当問題を修正した',
              '  - 検索: `grep -n "特定原材料" flashcard/questions.js`',
              '- [ ] `flashcard/shokuji-eiyou/index.html` のテーマカード・タグ・FAQ・JSON-LD を修正した',
              '- [ ] 正解の選択肢だけ項目数が増減していないか（数えるだけで当たる状態を避ける・ルール41）',
              '',
              '### 制度改正に依存する問題（正解が変わりうるもの）',
              '',
              '制度改正後の状態を「正しい記述」として出題している問題です。',
              'さらに改正があると、正しいはずの選択肢が誤りになり、正解が複数に見える状態になります',
              '（令和8年9月、ID141・183でこの状態を実際に検出しました）。',
              '',
              '- [ ] ID141：障害児通所支援の種類（令和6年4月に医療型児童発達支援を児童発達支援へ一元化）',
              '- [ ] ID183：自立援助ホームの対象年齢（令和4年改正・令和6年4月施行で弾力化）',
              '- [ ] ID195・ID492：一時保護の司法審査（一時保護状、令和7年6月施行）',
              '- [ ] ID146・ID1023：少年法の特定少年（令和3年改正・令和4年4月施行）',
              '- [ ] ID409：HPVワクチンの積極的勧奨（2022年4月再開）',
              '- [ ] ID191・ID371：地域小規模児童養護施設・分園型小規模グループケアの定員4〜6名（令和元年10月4日 子発1004第5号で確認済み）。本体施設内の小規模グループケアの定員は平成17年通知「児童養護施設等のケア形態の小規模化の推進について」で要確認',
              '- [ ] ID261・833・971：食物アレルギーの特定原材料（上記チェックリスト参照）',
              '- [ ] ID706：食物アレルギー表示の仕組み（義務の対象は容器包装された加工食品と添加物で、外食・店頭の量り売りなどの対面販売は対象外、代替表記、原則は個別表示）。外食への義務化など制度の変更がないか確認',
              '- [ ] ID606：子どもの貧困対策法（令和6年の改正で「こどもの貧困の解消に向けた対策の推進に関する法律」に題名変更）。都道府県計画・市町村計画の努力義務と、支援の柱（教育・生活・保護者の就労・経済的支援）にさらに改正がないか確認',
              '- [ ] ID1011：生活困窮者自立支援法の事業区分（自立相談支援事業・住居確保給付金は必須事業、就労準備支援事業・家計改善支援事業は任意事業のうち実施が努力義務、令和6年改正・令和7年4月施行で自立相談支援事業との一体的実施が原則化）。区分の変更がないか確認',
              '- [ ] ID330：放課後児童クラブの国の基準（支援の単位はおおむね40人以下、授業の休業日の開所は原則1日8時間以上、放課後児童支援員の資格と都道府県知事等の研修）。「放課後児童健全育成事業の設備及び運営に関する基準」の改正がないか確認',
              '- [ ] ID174・471：少子化社会対策大綱等を一元化した「こども大綱」（令和5年12月閣議決定）を前提とした問題。こども大綱の見直しや関連法の改正があれば確認',
              '- [ ] ID251・271・528・614・683・807・863：「日本人の食事摂取基準（2025年版）」（使用期間は令和7〜11年度）を前提とした問題。次の版が公表・適用されたら、版の表記と ID271 の推定エネルギー必要量（1〜2歳）を確認',
              '- [ ] ID508：こども誰でも通園制度（令和8年4月から全国で本格実施）を前提とした問題。対象年齢・利用時間の上限・就労要件を問わない仕組みに変更がないか、解説の「令和8年(2026年)4月から本格実施」の記述とあわせて確認',
              '- [ ] ID140・ID637：児童手当（令和6年10月改正：高校生年代までの延長、所得制限の撤廃、第3子以降月3万円、年6回の偶数月支給）を前提とした問題。支給額・支給月・対象にさらに改正がないか確認',
              '- [ ] ID562・ID728：子どもの一次救命処置・AEDの使用（小児用パッド、胸骨圧迫のテンポ等）。JRC蘇生ガイドラインの改訂で推奨が変わっていないか確認',
              '',
              '### 掲載しない方針の項目',
              '',
              '以下は**意図的に掲載していません**。年度が変わったときに更新を怠ると、',
              '受験生が誤った内容で準備してしまい、損失が大きいためです。',
              '棚卸しの際に追加しないよう注意してください。',
              '',
              '- 課題曲名（音楽）',
              '- お話の題材名（言語）',
              '- 試験日程',
              '',
              '確認の結果、変更がなかった場合も日付だけは更新してください。',
              'いつ時点の情報かが読者に伝わることが、この注記の目的です。',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[要確認] 実技試験の情報棚卸し（${new Date().getFullYear()}年）`,
              body,
            });
