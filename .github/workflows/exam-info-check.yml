              '- [ ] ID460：児童福祉文化財の推薦（令和5年度から社会保障審議会に代わってこども家庭審議会が推薦。出版物・舞台芸術・映像・メディア等の分野別審査、特別推薦、申請に基づく審査、都道府県児童福祉審議会の推薦権限）。こども家庭庁「児童福祉文化財」のページで運用の変更がないか確認',
